appId: com.warmindo.warmindo_pos
info:
  title: Scroll
  description: Geser layar katalog menu dan navigasi tab, pastikan elemen tetap tampil stabil.
---
- launchApp
- assertVisible: "Masuk ke Akun Kasir"
- tapOn:
    text: "Email"
- inputText: "admin@warmindo.com"
- tapOn:
    text: "Password"
- inputText: "password123"
- tapOn:
    text: "Masuk ke POS"
- assertVisible: "Katalog"

# Geser layar (swipe down & up) pada katalog menu
- swipe:
    direction: down
- assertVisible: "Katalog"
- swipe:
    direction: up
- assertVisible: "Katalog"

# Pindah ke tab Meja dan uji swipe
- tapOn:
    text: "Meja"
- assertVisible: "Total Meja"
- swipe:
    direction: down
- swipe:
    direction: up

# Kembali ke tab Katalog
- tapOn:
    text: "Katalog"
- assertVisible: "Katalog"
