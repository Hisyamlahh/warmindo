appId: com.warmindo.warmindo_pos
info:
  title: Scroll & Geser Katalog Menu
  description: Pengujian gestur swipe naik dan turun pada daftar katalog menu serta perpindahan tab.
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Masuk ke Akun Kasir"
    timeout: 15000
- assertVisible: "Masuk ke Akun Kasir"

# Login
- tapOn: "Email"
- inputText: "sudahmalam@gmail.com"
- tapOn: "Password"
- inputText: "sudahmalam"
- hideKeyboard
- tapOn: "Masuk ke POS"

# Tunggu dashboard muncul
- extendedWaitUntil:
    visible: "Semua"
    timeout: 15000
- assertVisible: "Semua"

# Geser layar (swipe up & down) pada katalog menu
- swipe:
    direction: UP
- assertVisible: "Semua"
- swipe:
    direction: DOWN
- assertVisible: "Semua"

# Pindah ke tab Meja dan uji swipe
- tapOn: "Meja.*"
- extendedWaitUntil:
    visible: "Total Meja"
    timeout: 10000
- assertVisible: "Total Meja"
- swipe:
    direction: UP
- swipe:
    direction: DOWN

# Kembali ke tab Katalog
- tapOn: "Katalog.*"
- extendedWaitUntil:
    visible: "Semua"
    timeout: 10000
- assertVisible: "Semua"
