appId: com.warmindo.warmindo_pos
info:
  title: Login
  description: Login dari layar login, isi email & password kasir/admin, validasi masuk ke Dashboard.
---
- launchApp
- assertVisible: "Masuk ke Akun Kasir"
- tapOn:
    text: "Email"
- inputText: "admin@warmindo.com"
- tapOn:
    text: "Password"
- inputText: "password123"
- tapOn:
    text: "Masuk ke POS"
- assertVisible: "Katalog"
- assertVisible: "Meja"
- assertVisible: "Riwayat"
