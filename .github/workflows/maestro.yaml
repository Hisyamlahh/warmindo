name: Maestro E2E UI Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  maestro-e2e:
    name: Run Maestro E2E Flows
    runs-on: macos-13

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android Debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro Flows on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            echo "Installing Warmindo JugaJago APK on Emulator..."
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            
            echo "Running Maestro End-to-End Tests..."
            maestro test maestro/flows/landing.yaml
            maestro test maestro/flows/login.yaml
            maestro test maestro/flows/order_checkout.yaml
            maestro test maestro/flows/scrolling.yaml

      - name: Upload Maestro Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-reports
          path: ~/.maestro/tests/
          retention-days: 7
